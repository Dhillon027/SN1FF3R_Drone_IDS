[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sn1ff3r"
version = "1.1.0"
description = "SN1FF3R: a lightweight, real-time MAVLink intrusion detection system for companion computers"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "pymavlink>=2.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sn1ff3r = "drone_ids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"drone_ids.gui" = ["static/*.html"]
